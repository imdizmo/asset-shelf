# ShelfServer's own releases, apart from Asset Shelf's: a tag shelf-server-v<x.y.z> (equal to the version in
# server/ShelfServer/ShelfServer.csproj, with its section in server/CHANGELOG.md) publishes the server for
# linux-x64, linux-arm64 and win-x64 with a SHA256SUMS file, as a release that is never marked latest, and the image
# ghcr.io/<owner>/shelf-server (amd64, arm64). A run by hand only builds them.
name: Server release

on:
  push:
    tags: ['shelf-server-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73  # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - name: Version and notes
        id: v
        run: |
          sv=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' server/ShelfServer/ShelfServer.csproj)
          echo "version=$sv" >> "$GITHUB_OUTPUT"
          awk -v h="## [$sv]" 'index($0, h) == 1 {on = 1; next} on && /^## \[/ {exit} on' server/CHANGELOG.md > notes.md
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "shelf-server-v$sv" ]] || { echo "::error::tag $GITHUB_REF_NAME is not shelf-server-v$sv (the .csproj version)"; exit 1; }
            [[ -n "$(tr -d '[:space:]' < notes.md)" ]] || { echo "::error::server/CHANGELOG.md has no section ## [$sv]"; exit 1; }
          fi
          cat notes.md
      - name: Build for each platform
        run: |
          sv="${{ steps.v.outputs.version }}"
          for rid in linux-arm64 linux-x64 win-x64; do
            n="ShelfServer-$sv-$rid"
            dotnet publish server/ShelfServer -c Release -r "$rid" --self-contained -p:PublishSingleFile=true -p:PublishTrimmed=true -p:DebugType=none -o "dist/$n/bin"
            cp server/README.md server/CHANGELOG.md "dist/$n/"
            if [[ "$rid" == win-* ]]; then
              (cd dist && zip -qr "$n.zip" "$n")
            else
              cp server/start.sh server/stop.sh server/update.sh "dist/$n/"
              tar -czf "dist/$n.tar.gz" -C dist "$n"
            fi
          done
          (cd dist && sha256sum ShelfServer-*.tar.gz ShelfServer-*.zip > SHA256SUMS && cat SHA256SUMS)
          mv notes.md dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: server
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/notes.md
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/shelf-server-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: server
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "ShelfServer ${{ needs.build.outputs.version }}" --notes-file dist/notes.md --latest=false

  image:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        if: startsWith(github.ref, 'refs/tags/shelf-server-v')
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/shelf-server-v') }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/shelf-server:${{ needs.build.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/shelf-server:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=ShelfServer, the team library service of Asset Shelf
            org.opencontainers.image.licenses=MIT
